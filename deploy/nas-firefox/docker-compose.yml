# NAS 上的「按需 Firefox」——只在要登入時 start，平時 docker stop（0 CPU / 0 RAM）。
# cookie 擷取直接讀 profile 的 sqlite（python3 -m ytm.cookie --extract），不需啟動瀏覽器。
#
# 為什麼非得有個真瀏覽器：認證必要的 __Secure-1PSIDTS 由瀏覽器向 Google 輪替，
# 複製出來的靜態 cookie 幾天後就失效，任何請求都不會讓 Google 補發它（實測過）。
# 也就是說 profile 停放太久同樣會過期，屆時要再進來登入一次。
services:
  ytm-firefox:
    image: jlesage/firefox:latest      # 有 arm64，Synology ARM 也能跑
    container_name: ytm-firefox
    ports:
      - "5800:5800"                    # 網頁 GUI（建議只開內網）
    volumes:
      - ./ff-profile:/config           # Firefox profile 持久化（登入狀態存這）
    shm_size: "1gb"                    # 2GB RAM 的機型要降到 256m，否則會 OOM
    environment:
      - TZ=Asia/Taipei
      # 一開容器就自己載入 YTM：省掉手動打網址，也讓「定期開一下續期 cookie」
      # 變成只要 docker start 就完成（瀏覽器載入頁面才會向 Google 輪替憑證）。
      - FF_OPEN_URL=https://music.youtube.com/
      # 強烈建議開啟存取保護（它裝著你的 Google session）：
      # - WEB_AUTHENTICATION=1
      # - WEB_AUTHENTICATION_USERNAME=you
      # - WEB_AUTHENTICATION_PASSWORD=set-a-password
    restart: "no"                      # 平時 docker stop，要登入才 docker start
